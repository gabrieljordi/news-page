<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News Page</title>
  <link rel="stylesheet" href="styles/index.css">
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
</head>

<body>
  <header class="container">
    <nav id="primary" class="grid grid-column">
      <div>
        <img src="assets/icons/list.svg" alt="Menu Icon">
        <strong>Menu</strong>
      </div>
      <div>
        <img src="assets/icons/logo.svg" alt="Logo Icon">
      </div>
      <div>
        <img src="assets/icons/magnifyingglass.svg" alt="Search Icon">
        <strong>Search</strong>
      </div>
    </nav>
    <nav id="secondary" class="grid grid-column">
      <a href="#">Artificial Intelligence</a>
      <a href="#">Blockchain</a>
      <a href="#">Cybersecurity</a>
      <a href="#">Cloud Computing</a>
      <a href="#">Internet of Things</a>
      <a href="#">Quantum Computing</a>
      <a href="#">Virtual Reality</a>
    </nav>
  </header>
  <main class="grid container">
    <section id="featured" class="grid grid-column gap-16">
      <figure class="card">
        <img src="assets/images/image_01.png" alt="Image 1">
        <figcaption>
          <span class="content-tag">Robotics</span>
          <h2 class="text-2xl">Domestic robots are beginning to be adopted for daily tasks, promising more comfort and
            efficiency in homes.</h2>
        </figcaption>
      </figure>
      <div class="grid grid-column2 gap-16">
        <figure class="card">
          <img src="assets/images/image_02.png" alt="Image 2">
          <figcaption>
            <span class="content-tag">Holograms</span>
            <h2 class="text-lg">New 3D Projector Smartphone hits the market, transforming the way we see our screens!
            </h2>
          </figcaption>
        </figure>
        <figure class="card">
          <img src="assets/images/image_03.png" alt="Image 3">
          <figcaption>
            <span class="content-tag">Internet</span>
            <h2 class="text-lg">6G technology arrives, promising to revolutionize the way we live and communicate.
            </h2>
          </figcaption>
        </figure>
        <figure class="card">
          <img src="assets/images/image_04.png" alt="Image 4">
          <figcaption>
            <span class="content-tag">Wearables</span>
            <h2 class="text-lg">Company launches smartwatch capable of monitoring mental health, offering valuable insights into...
            </h2>
          </figcaption>
        </figure>
        <figure class="card">
          <img src="assets/images/image_05.png" alt="Image 5">
          <figcaption>
            <span class="content-tag">Virtual Reality</span>
            <h2 class="text-lg">Schools adopt VR technology to provide immersive experiences, transforming traditional learning.
            </h2>
          </figcaption>
        </figure>
      </div>
    </section>
    <section id="trending">
      <header class="grid grid-column">
        <h3>Trending News</h3>
        <a href="#" class="grid grid-column">
          <strong>See more</strong>
          <span></span>
        </a>
      </header>
      <div class="grid gap-16">
        <figure>
          <span class="content-tag">Vehicles</span>
          <img src="assets/images/image_06.png" alt="Image 6">
          <p>A prototype of a flying vehicle is unveiled, marking the beginning of the era of personal air transport.</p>
        </figure>
        <figure>
          <span class="content-tag">Holograms</span>
          <img src="assets/images/image_07.png" alt="Image 7">
          <p>Videoconferencing platform introduces a new hologram feature, making virtual calls more realistic and immersive.</p>
        </figure>
        <figure>
          <span class="content-tag">Virtual Reality</span>
          <img src="assets/images/image_08.png" alt="Image 8">
          <p>New generation of video game consoles is launched, bringing ultra-realistic graphics and fully immersive gaming experiences.</p>
        </figure>
        <figure>
          <span class="content-tag">Internet</span>
          <img src="assets/images/image_09.png" alt="Image 9">
          <p>The project seeks to provide high-speed internet in remote areas via satellites.</p>
        </figure>
      </div>
    </section>
  </main>
</body>

</html>
